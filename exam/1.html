<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <link
            rel="stylesheet"
            href="1.css"
        />
        <title>Задание 1</title>
    </head>
    <body>
        <div class="filter-block">
            <input type="text" class="search-input" placeholder="Поиск сотруденика">
            <select>
                <option>Все подразделения</option>
                <option>ИИК</option>
                <option>ИЭУ</option>
                <option>ИАРКТ</option>
            </select>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item1"
                    />
                    <label for="item1">Ректорат</label>
                </div>
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item2"
                    />
                    <label for="item2">Директора и деканы</label>
                </div>
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item3"
                    />
                    <label for="item3">Заведующие кафедрами</label>
                </div>
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item4"
                    />
                    <label for="item4">Профессора</label>
                </div>
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item5"
                    />
                    <label for="item5">Доценты</label>
                </div>
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item6"
                    />
                    <label for="item6">Ассистенты и преподаватели</label>
                </div>
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item7"
                    />
                    <label for="item7">Начальники управлений</label>
                </div>
                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="item8"
                    />
                    <label for="item8">Научные работники</label>
                </div>
            </div>

            <div class="buttons">
                <button class="apply">Применить</button>
                <button class="reset">Сбросить</button>
            </div>
        </div>
    </body>
    <script src="2.js"></script>
</html>
